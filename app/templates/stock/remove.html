{% extends "base.html" %}
{% block title %}Remove Stock | Inventory Pro{% endblock %}

{% block content %}
<div class="container py-5 animate-fade-in" style="max-width: 700px;">
    <div class="glass-card">
        <div class="d-flex align-items-center mb-4">
            <div class="rounded-circle bg-danger bg-opacity-10 p-3 me-3">
                <i class="bi bi-box-arrow-right text-danger fs-4"></i>
            </div>
            <div>
                <h3 class="mb-1 fw-bold text-white">Remove Stock</h3>
                <p class="text-secondary mb-0 small">Record product removal from inventory.</p>
            </div>
        </div>

        <form action="{{ url_for('stock.remove_stock') }}" method="POST">
            <!-- Product Selector -->
            <div class="mb-4">
                <label class="stat-label mb-2 d-block">Select Product</label>
                <select name="product_id" class="select-dark" style="padding: 1rem;" required>
                    <option value="" disabled selected>Select product to remove units from...</option>
                    {% for product in products %}
                        <option value="{{ product.id }}">{{ product.name }} (Available: {{ product.quantity }})</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Quantity -->
            <div class="mb-4">
                <label class="stat-label mb-2 d-block">Quantity to Remove</label>
                <div class="search-input-wrapper">
                    <i class="bi bi-dash-lg search-icon"></i>
                    <input type="number" name="quantity" class="input-dark" style="padding-left: 3rem;"
                           min="1" placeholder="How many units are being removed?" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-5">
                <a href="{{ url_for('stock.list_movements') }}" class="btn-glass text-secondary">
                    <i class="bi bi-x-circle me-2"></i> Cancel
                </a>
                <button type="submit" class="btn-gradient px-5" style="--accent-primary: #ef4444; --accent-secondary: #f97316; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);">
                    <i class="bi bi-dash-circle me-2"></i> Confirm Removal
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
