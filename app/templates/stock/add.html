{% extends "base.html" %}
{% block title %}Receive Stock{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 700px;">
    
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">

            <h3 class="mb-4 fw-bold">Receive Stock</h3>

            <form action="{{ url_for('stock.add_stock') }}" method="POST">

                <!-- Product Selector -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Select Product</label>
                    <select name="product_id" class="form-select form-select-lg rounded-3" required>
                        <option value="" disabled selected>Choose a product...</option>
                        {% for product in products %}
                            <option value="{{ product.id }}">{{ product.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Quantity -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Quantity</label>
                    <input type="number" name="quantity" class="form-control form-control-lg rounded-3"
                           min="1" placeholder="Enter quantity" required>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('stock.list_movements') }}" class="btn btn-outline-secondary px-4 py-2 rounded-3">
                        Cancel
                    </a>
                    <button class="btn btn-success px-4 py-2 rounded-3 fw-semibold">
                        Add Stock
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>
{% endblock %}
